[project]
name = "fiv-admin"
version = "0.1.0"
description = "Front d'administration Fivorites V2 — suivi de l'acquisition"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=2.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
fiv-admin = "fiv_admin.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiv_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["integration: nécessite Postgres (make db-create côté sourcing)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
