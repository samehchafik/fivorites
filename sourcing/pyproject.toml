[project]
name = "fiv-sourcing"
version = "0.1.0"
description = "Acquisition de données pour Fivorites V2 — séries"
requires-python = "==3.12.*"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
]

[project.scripts]
fiv-sourcing = "fiv_sourcing.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiv_sourcing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["integration: nécessite Postgres (make db-create)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
