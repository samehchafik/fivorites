# Déploiement serveur.
#
# Postgres n'est PAS conteneurisé : il tourne sur l'hôte, installé par apt (voir
# doc/serveur-debian11.md). Seule l'application est en conteneur, et elle joint
# la base par la passerelle du réseau Docker.
#
# Le sous-réseau est figé volontairement. Sans ça, Docker en choisit un au
# hasard à la création du réseau, l'adresse de la passerelle change, et il faut
# reprendre `listen_addresses` et `pg_hba.conf` à chaque fois. Ici l'adresse est
# connue à l'avance : la configuration Postgres peut être écrite une fois.
#
# Variables attendues dans un `.env` à côté de ce fichier (voir .env.example).

name: fivorites-v2

services:
  sourcing:
    build:
      context: ./sourcing
    image: fivorites-v2/sourcing:latest
    # Pipeline par lots, pas service permanent : on ne veut pas qu'un
    # `compose up` lance une collecte. Il s'invoque à la demande —
    #   docker compose run --rm sourcing db migrate
    #   docker compose run --rm sourcing tmdb fetch --id 1399
    profiles: ["cli"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-fivorites_v2}:${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}@${DB_HOST:-172.28.0.1}:${DB_PORT:-5432}/${DB_NAME:-fivorites_v2}
      DB_SCHEMA: ${DB_SCHEMA:-sourcing}
      TMDB_BEARER: ${TMDB_BEARER:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_RATE_LIMIT: ${TMDB_RATE_LIMIT:-20}
      TMDB_SEASON_LANGUAGES: ${TMDB_SEASON_LANGUAGES:-fr-FR,en-US,es-ES,ar-SA,tr-TR}

networks:
  default:
    ipam:
      config:
        # 172.28.0.1 est l'hôte vu depuis les conteneurs. C'est cette adresse
        # que Postgres doit écouter et que pg_hba.conf doit autoriser.
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
