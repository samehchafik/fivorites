# Déploiement serveur.
#
# Postgres n'est PAS conteneurisé : il tourne sur l'hôte, installé par apt (voir
# doc/serveur-debian11.md), et les conteneurs le joignent par la passerelle du
# réseau Docker. Il porte les données de la collecte — ce qui ne se reconstruit
# pas — et cette frontière est la raison du partage : tout le reste est en
# conteneur, y compris Elasticsearch, dont le contenu se REFABRIQUE depuis
# Postgres (`search reindex`).
#
# Le sous-réseau est figé volontairement. Sans ça, Docker en choisit un au
# hasard à la création du réseau, l'adresse de la passerelle change, et il faut
# reprendre `listen_addresses` et `pg_hba.conf` à chaque fois. Ici l'adresse est
# connue à l'avance : la configuration Postgres peut être écrite une fois.
#
# Variables attendues dans un `.env` à côté de ce fichier (voir .env.example).

name: fivorites-v2

services:
  sourcing:
    build:
      context: ./sourcing
    image: fivorites-v2/sourcing:latest
    # Pipeline par lots, pas service permanent : on ne veut pas qu'un
    # `compose up` lance une collecte. Il s'invoque à la demande —
    #   docker compose run --rm sourcing db migrate
    #   docker compose run --rm sourcing tmdb fetch --id 1399
    profiles: ["cli"]
    # Le délai laissé à un `docker stop` avant le SIGKILL. Le défaut de Docker
    # est de **dix secondes**, et c'est trop court ici : `backfill` intercepte
    # SIGTERM pour laisser les collectes en vol aller à leur terme, mais une
    # série de huit saisons en cinq langues, c'est quarante requêtes.
    #
    # Ce que coûte un SIGKILL au mauvais moment : la fiche est marquée réussie
    # avant que ses saisons soient téléchargées, donc une série tuée entre les
    # deux garde des saisons manquantes que `backfill` ne reprendra jamais —
    # il ne sélectionne que ce qui n'a jamais abouti.
    stop_grace_period: 180s
    environment:
      DATABASE_URL: postgresql://${DB_USER:-fivorites_v2}:${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}@${DB_HOST:-172.28.0.1}:${DB_PORT:-5432}/${DB_NAME:-fivorites_v2}
      DB_SCHEMA: ${DB_SCHEMA:-sourcing}
      TMDB_BEARER: ${TMDB_BEARER:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_RATE_LIMIT: ${TMDB_RATE_LIMIT:-20}
      # Débit vers Wikidata, Wikipédia et TVmaze — services gratuits et
      # partagés, d'où un plafond bien plus bas que celui de TMDB.
      ENRICH_RATE_LIMIT: ${ENRICH_RATE_LIMIT:-2}
      TMDB_SEASON_LANGUAGES: ${TMDB_SEASON_LANGUAGES:-fr-FR,en-US,es-ES,ar-SA,tr-TR}

  # --- Distillation ----------------------------------------------------------
  #
  # Apprendre au petit encodeur local à reproduire la représentation du gros.
  # Lancé à la demande, une fois tous les quelques mois, et long : comptez une
  # dizaine d'heures sur processeur. Voir distillation/README.md.
  #
  # Tout passe par `./export` : le corpus y arrive (`training corpus-export`),
  # la reprise s'y écrit, l'élève en sort. Rien ne vit dans le conteneur, ce qui
  # est la condition pour qu'une coupure ne coûte que les derniers lots.
  #
  #   mkdir -p export && sudo chown 10002:10002 export
  #   docker compose --profile cli build distillation
  #   docker compose run --rm -d distillation --corpus corpus.jsonl \
  #       --sortie eleve-distille --longueur 256 --geler 1 --lot 16 --fils 4
  distillation:
    build:
      context: ./distillation
    image: fivorites-v2/distillation:latest
    profiles: ["cli"]
    volumes:
      - ./export:/travail
    # Un entraînement qui rend la main en dix secondes n'existe pas : il faut
    # laisser le temps d'écrire la reprise avant le SIGKILL.
    stop_grace_period: 120s

  # --- Recherche -------------------------------------------------------------
  #
  # Elasticsearch, service permanent comme l'administration. Contrairement à
  # Postgres — qui reste sur l'hôte parce qu'il porte les données de la
  # collecte — celui-ci est conteneurisé : son contenu est **dérivé**, il se
  # reconstruit entièrement depuis Postgres par `search reindex`. Le perdre ne
  # coûte qu'une réindexation, jamais une donnée.
  #
  # Image officielle, version figée : la même que celle vendorisée sur le
  # poste (admin/.es-version). Les deux doivent avancer ensemble — un index
  # construit par une version ne se relit pas forcément par une plus ancienne.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    restart: unless-stopped
    environment:
      cluster.name: fivorites
      node.name: serveur
      discovery.type: single-node
      # Pas de TLS ni de comptes : le service n'a AUCUN port publié (voir
      # l'absence de `ports:` ci-dessous), il n'est joignable que par les
      # autres conteneurs du réseau compose. L'activer imposerait une
      # cérémonie de certificats pour une liaison qui ne sort jamais de la
      # machine. Corollaire : ne jamais ajouter de `ports:` ici sans activer
      # xpack.security en même temps.
      xpack.security.enabled: "false"
      # Aucune fonction de machine learning utilisée : autant ne pas réserver
      # la mémoire qu'elle prend.
      xpack.ml.enabled: "false"
      # Le tas. Deux gigaoctets pour ~1,5 M de documents minimaux par univers ;
      # le conteneur est plafonné à un peu plus bas (`mem_limit`), car la JVM
      # a besoin de place hors tas.
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms2g -Xmx2g}
      # Les seuils d'allocation d'ES sont en POURCENTAGE par défaut
      # (85/90/95 %), et un disque déjà bien rempli fait alors un cluster
      # « red » sans qu'aucun index soit en cause — vécu sur le poste de dev.
      # En absolu, il travaille tant qu'il reste de la place.
      cluster.routing.allocation.disk.watermark.low: 10gb
      cluster.routing.allocation.disk.watermark.high: 6gb
      cluster.routing.allocation.disk.watermark.flood_stage: 4gb
    mem_limit: ${ES_MEM_LIMIT:-3g}
    ulimits:
      # ES verrouille sa mémoire pour ne jamais être mis en swap — un GC qui
      # swappe est pire qu'un GC lent.
      memlock: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    # Pas de `ports:` — volontairement. Seul le conteneur `admin` le joint, par
    # le réseau interne du compose. Pour regarder depuis la machine :
    #   docker compose exec elasticsearch curl -s localhost:9200/_cat/indices
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Le démarrage d'une JVM plus l'ouverture des index : large, parce qu'un
      # `admin` qui démarrerait trop tôt tomberait sur un service muet et
      # passerait en repli SQL pour rien.
      start_period: 90s

  # --- Administration --------------------------------------------------------
  #
  # Service permanent, contrairement à `sourcing` : il répond en HTTP.
  #
  # Deux sortes de requêtes, et le partage se lit ici :
  #
  #   /api/*        → FastAPI, dans ce conteneur
  #   tout le reste → des fichiers, lus dans ./www monté en volume
  #
  # Le front n'est pas dans l'image. `./www` est le répertoire statique — il ne
  # contient QUE le résultat du build, `index.html` et ses fichiers — et le
  # conteneur y accède par le montage ci-dessous. Redéployer le front ne demande
  # donc ni rebuild ni push : on reconstruit ./www et on recharge la page.
  #
  # Les sources React sont dans ./front et ne sont montées nulle part ici : un
  # répertoire servi en HTTP n'a à contenir ni code source, ni package.json, ni
  # node_modules.
  admin:
    build:
      context: ./admin
    image: fivorites-v2/admin:latest
    restart: unless-stopped
    # `service_started`, PAS `service_healthy` — et c'est un choix.
    #
    # La condition de santé ferait attendre le démarrage complet d'ES à
    # CHAQUE `docker compose run --rm admin …`, y compris `db migrate`, qui
    # n'a rien à voir avec la recherche. Pire : un ES en panne rendrait ces
    # commandes impossibles, alors que l'administration est justement conçue
    # pour fonctionner sans lui (repli SQL). On le démarre donc avec, sans
    # lui confier le sort du reste.
    depends_on:
      elasticsearch:
        condition: service_started
    ports:
      # Adresse d'écoute réglable, ouverte par défaut — choix explicite pour
      # pouvoir joindre l'administration directement pendant la mise en route.
      #
      # Ce qui circule alors en clair : le mot de passe du formulaire de
      # connexion, et le cookie de session à chaque requête. `ADMIN_BIND=127.0.0.1`
      # dans `.env` referme l'accès à la machine (on y arrive par un tunnel SSH)
      # le jour où un reverse proxy TLS est en place — avec `ADMIN_COOKIE_SECURE=true`.
      - "${ADMIN_BIND:-0.0.0.0}:${ADMIN_PORT:-8182}:8182"
    volumes:
      # Lecture seule : le service sert ces fichiers, il ne les écrit jamais.
      - ./www:/srv/www:ro
    environment:
      DATABASE_URL: postgresql://${DB_USER:-fivorites_v2}:${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}@${DB_HOST:-172.28.0.1}:${DB_PORT:-5432}/${DB_NAME:-fivorites_v2}
      SOURCING_SCHEMA: ${DB_SCHEMA:-sourcing}
      # Obligatoire : sans elle un secret est tiré au hasard à chaque démarrage,
      # donc toute session saute au redémarrage.  openssl rand -hex 32
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?ADMIN_SECRET_KEY doit être défini dans .env}
      # `Secure` sur le cookie : à mettre à true dès qu'un TLS est devant.
      COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-12}
      # Une seule origine en production (l'API sert les fichiers) : rien à
      # autoriser en CORS.
      CORS_ORIGINS: ""
      SEASON_LANGUAGES: ${TMDB_SEASON_LANGUAGES:-fr-FR,en-US,es-ES,ar-SA,tr-TR}
      WEB_DIST: /srv/www
      # La recherche plein texte. Comme Postgres, Elasticsearch tourne sur
      # l'HÔTE (apt, voir doc/recherche-elasticsearch.md), joint par la
      # passerelle — pas un conteneur de plus à orchestrer. Facultatif : tant
      # qu'il ne répond pas, la recherche retombe sur l'ILIKE historique.
      ES_URL: ${ES_URL:-http://elasticsearch:9200}
      # L'atelier d'entraînement (pages Training 1 et 2). Facultatives : sans
      # elles, tout le reste de l'admin fonctionne et les routes /training
      # répondent par un message clair.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # L'encodeur des dossiers. Trois formes : un nom fastembed (local, gratuit),
      # `openai/…` (API, payante), `local:/opt/models/x` (modèle maison en ONNX,
      # c'est par là que revient l'élève distillé).
      #
      # Mesuré sur 502 œuvres, à dimension égale : jina rend 1,020 de MAE, le
      # modèle d'API 0,853. Si la clé OpenAI manque ou que l'API tombe, le local
      # reprend la main et son vecteur est rangé sous SON étiquette — il sert
      # l'affichage, jamais l'entraînement.
      EMBEDDER: ${EMBEDDER:-openai/text-embedding-3-large@512}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      # Le nombre de fils de calcul de l'algèbre linéaire, brimé exprès.
      #
      # OpenBLAS compte les cœurs de l'HÔTE, pas le quota du conteneur : sur une
      # machine à seize cœurs limitée à deux, il lance seize fils qui se
      # disputent deux processeurs, et une décomposition qui prend une seconde
      # en prend trente. Le symptôme est trompeur — le calcul n'échoue pas, il
      # rampe — et il ne se voit qu'en comparant à la même opération hors
      # conteneur. Mesuré ici sur l'entraînement d'un encodeur à 3 072
      # dimensions : plus de quatre heures là où le calcul vaut quelques
      # minutes.
      #
      # Quatre par défaut plutôt que le nombre exact de cœurs alloués : une
      # sur-réservation d'un facteur deux ne se sent pas, contrairement à un
      # facteur huit. À relever via BLAS_THREADS sur une machine dédiée.
      OMP_NUM_THREADS: ${BLAS_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${BLAS_THREADS:-4}
      MKL_NUM_THREADS: ${BLAS_THREADS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8182/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Les index de recherche. Contenu dérivé : `search reindex` le reconstruit
  # depuis Postgres, donc ce volume se supprime sans perte — à la différence
  # des données de Postgres, qui vivent sur l'hôte.
  es-data:

networks:
  default:
    ipam:
      config:
        # 172.28.0.1 est l'hôte vu depuis les conteneurs. C'est cette adresse
        # que Postgres doit écouter et que pg_hba.conf doit autoriser.
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
