# five.ifrit.fr — le vhost nginx du site public.
#
# Installé par deploy/install-five.sh dans /etc/nginx/sites-available/, jamais
# édité sur place : la source de vérité est ici, dans le dépôt — comme le
# Makefile écrit la conf d'Elasticsearch, pas l'inverse.
#
# Le partage est simple : nginx porte le nom, le TLS et la compression ; tout
# le trafic — pages statiques comme /api/public/* — part au conteneur webapp
# sur la boucle locale (WEBAPP_BIND=127.0.0.1 dans le .env du compose).

# HTTP : le défi ACME passe (c'est par lui que le certificat se renouvelle),
# tout le reste bascule en HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name five.ifrit.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name five.ifrit.fr;

    ssl_certificate     /etc/letsencrypt/live/five.ifrit.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/five.ifrit.fr/privkey.pem;
    # Les paramètres TLS, écrits ici plutôt qu'inclus depuis un fichier posé
    # par certbot : le plugin nginx de certbot n'est pas utilisé (webroot
    # seulement), donc ses fichiers d'options n'existent pas forcément.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Six mois de HSTS : après la première visite, le navigateur refuse de
    # lui-même de repasser en clair. Pas de preload ni d'includeSubDomains
    # tant que tout ifrit.fr n'est pas en TLS.
    add_header Strict-Transport-Security "max-age=15552000" always;

    # La compression, que le service FastAPI ne fait pas lui-même — une fois
    # ici pour tout : les pages HTML du SEO comme le JSON de l'API.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location / {
        proxy_pass http://127.0.0.1:8183;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
